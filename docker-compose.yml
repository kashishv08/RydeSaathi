version: "3.9"

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: uber_db
      POSTGRES_USER: uber_user
      POSTGRES_PASSWORD: uber_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"

  backend:
    build: ./server
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    volumes:
      - ./server:/app
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
      - redis

  frontend:
    build: ./client
    volumes:
      - ./client:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  celery_worker:
    build:
      context: ./server
    command: celery -A config worker --loglevel=info
    # WHY --loglevel=info: Shows task start/success/failure in logs.
    # Change to 'warning' in production to reduce noise.
    volumes:
      - ./server:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis

volumes:
  pgdata:
