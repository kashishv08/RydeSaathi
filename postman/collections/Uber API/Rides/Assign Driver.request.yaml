$kind: http-request
name: Assign Driver
order: 7000
method: PATCH
url: '{{baseUrl}}/api/rides/{{rideId}}/assign-driver/'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "driver_id": "{{driverId}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: 'pm.test("Status 200", () => pm.response.to.have.status(200));'
