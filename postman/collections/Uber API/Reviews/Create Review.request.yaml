$kind: http-request
name: Create Review
order: 1000
method: POST
url: '{{baseUrl}}/api/reviews/create/'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "stars": 5,
      "comment": "Great ride!",
      "ride_id": "{{rideId}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: 'pm.test("Status 201", () => pm.response.to.have.status(201));'
