$kind: http-request
name: Login
order: 2000
method: POST
url: "{{baseUrl}}/api/auth/login"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "email": "{{email}}",
        "password": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
          const body = pm.response.json();
          pm.environment.set("accessToken", body.access);
          pm.environment.set("refreshToken", body.refresh);
          console.log("Tokens saved for:", pm.environment.name);
      }
      pm.test("Status 200", () => pm.response.to.have.status(200));
    language: text/javascript
