$kind: http-request
name: Logout
order: 4000
method: POST
url: '{{baseUrl}}/api/auth/logout/'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "refresh": "{{refreshToken}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: 'pm.test("Status 200", () => pm.response.to.have.status(200));'
