$kind: http-request
name: Submit Driving Licence
order: 2000
method: POST
url: '{{baseUrl}}/api/drivers/dl-submit/'
body:
  type: formdata
  content:
    - key: dl_image
      type: text
      value: '<file path>'
scripts:
  - type: afterResponse
    language: text/javascript
    code: 'pm.test("Status 200", () => pm.response.to.have.status(200));'
