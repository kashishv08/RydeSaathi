$kind: http-request
name: Toggle Online Status
order: 3000
method: POST
url: '{{baseUrl}}/api/drivers/toggle-online'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "online": true
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: 'pm.test("Status 200", () => pm.response.to.have.status(200));'
