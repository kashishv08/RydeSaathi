server {
    listen 80;
    server_name 13.233.117.14; # Your EC2 IP

    # 1. Serve React Frontend
    location / {
        root /home/ubuntu/rydesaathi/client/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Serve Django Static Files
    location /static/ {
        alias /home/ubuntu/rydesaathi/server/static/;
    }

    # 3. Serve Django Media Files
    location /media/ {
        alias /home/ubuntu/rydesaathi/server/media/;
    }

    # 4. Route API and Admin traffic to Gunicorn
    location ~ ^/(api|admin) {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. Route WebSockets to Daphne
    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
